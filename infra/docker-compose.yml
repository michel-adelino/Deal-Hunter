# docker-compose.yml
version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dealhunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./backend/api
    env_file: ./backend/api/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/api:/app

  celery_worker:
    build: ./backend/api
    env_file: ./backend/api/.env
    depends_on:
      - postgres
      - redis
    command: celery -A tasks.hunt_task worker --loglevel=info --concurrency=4

  celery_beat:
    build: ./backend/api
    env_file: ./backend/api/.env
    depends_on:
      - redis
    command: celery -A tasks.hunt_task beat --loglevel=info

  scrapers:
    build: ./backend/scrapers
    env_file: ./backend/scrapers/.env
    depends_on:
      - redis
    # Rust binary
    command: ./target/release/dealhunter-scrapers

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
