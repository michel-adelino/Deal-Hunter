[package]
name = "dealhunter-scrapers"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
scraper = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.24", features = ["aio", "json"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
